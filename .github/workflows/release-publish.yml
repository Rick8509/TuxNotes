name: "Release step 2: build and publish"

# Step 2 of a release (docs/RELEASING.md): runs when the "Release vX.Y.Z" pull request
# is merged into main. Builds the .deb, .rpm and AppImage, adds checksums and a signed
# record of the build, tags the version and publishes the GitHub Release with the
# changelog notes. Nothing is published unless every step before it succeeded.
#
# Test run: Actions → "Release step 2: build and publish" → Run workflow (from dev) builds the packages without
# publishing anything; they're attached to the run as "packages".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run: build the packages but don't publish anything"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that every file has the same version and the changelog has its notes
        id: check
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            # Test runs happen before a release is prepared: only the versions must agree.
            node scripts/release.mjs check
          else
            node scripts/release.mjs check "$(node scripts/release.mjs current)"
          fi
      - name: Decide
        id: decide
        env:
          VERSION: ${{ steps.check.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Test run: building $VERSION without publishing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases are published from main only. Use a test run on other branches."
            exit 1
          else
            echo "Publishing v$VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The oldest supported Ubuntu, so the packages run on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .deb, .rpm and AppImage
        env:
          # Google sign-in for Drive backup is built in once these repository secrets
          # exist (docs/google-setup.md); without them the packages simply don't offer it.
          TUXNOTES_GOOGLE_CLIENT_ID: ${{ secrets.TUXNOTES_GOOGLE_CLIENT_ID }}
          TUXNOTES_GOOGLE_CLIENT_SECRET: ${{ secrets.TUXNOTES_GOOGLE_CLIENT_SECRET }}
        run: npx tauri build
      - name: Collect the packages and check them
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir packages
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage packages/
          cd packages
          for ext in deb rpm AppImage; do
            count=$(ls *."$ext" 2>/dev/null | wc -l)
            if [ "$count" != 1 ]; then echo "::error::Expected one .$ext package, found $count"; exit 1; fi
          done
          deb_version=$(dpkg-deb -f *.deb Version)
          if [ "$deb_version" != "$VERSION" ]; then
            echo "::error::The .deb says version $deb_version, expected $VERSION"; exit 1
          fi
          dpkg-deb -c *.deb | grep -q 'usr/share/metainfo/io.github.Rick8509.TuxNotes.metainfo.xml' \
            || { echo "::error::The .deb is missing the AppStream file"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build record
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Record how the packages were built (signed build provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/*.deb
            packages/*.rpm
            packages/*.AppImage
      - name: Write the release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          {
            echo "**Download** the file for your Linux under *Assets* below: \`.deb\` for Ubuntu, Debian and Mint, \`.rpm\` for Fedora and openSUSE, \`.AppImage\` for any other. Install instructions: [README](https://github.com/$GITHUB_REPOSITORY#install)."
            echo
            node scripts/release.mjs notes "$VERSION"
            echo
            echo "---"
            echo "Checksums are in \`SHA256SUMS.txt\`. Each package has a signed record that it was built here: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } > "$RUNNER_TEMP/notes.md"
      - name: "Release step 2: build and publish"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Upload everything to a draft first, then publish it, so nobody sees a half-uploaded release.
          gh release create "v$VERSION" packages/* --draft --target "$GITHUB_SHA" \
            --title "TuxNotes $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "v$VERSION" --draft=false --latest
          url=$(gh release view "v$VERSION" --json url --jq .url)
          echo "### TuxNotes $VERSION is published: $url" >> "$GITHUB_STEP_SUMMARY"
