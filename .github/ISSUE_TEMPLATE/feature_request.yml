name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what's missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could TuxNotes help?
      description: Your idea for how it could work. Mockups or examples from other apps are welcome.
    validations:
      required: false
