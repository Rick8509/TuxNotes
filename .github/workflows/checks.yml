name: Checks (tests on every change)

# Tests every push to dev and main and every pull request. main only accepts a merge
# when all four jobs pass (see docs/RELEASING.md before renaming a job).

on:
  push:
    # dev is where the work happens; main gets it through pull requests.
    branches: [main, dev]
  pull_request:
  # "Release step 1" starts the checks on its release commit this way.
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Engine tests (notes storage, search, Google Drive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p tuxnotes-core -p tuxnotes-gdrive --all-targets -- -D warnings
      - run: cargo test -p tuxnotes-core -p tuxnotes-gdrive

  frontend:
    name: Interface tests (type check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check the app store information (AppStream)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net --explain packaging/*.metainfo.xml

  e2e:
    name: Click-through tests (the app in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners come with Google Chrome.
      - run: npm run test:e2e

  app:
    name: App build
    runs-on: ubuntu-22.04
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p tuxnotes
